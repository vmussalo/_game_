<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Laitekehys</title>
<style>html, body { margin: 0; background: #222; } iframe { border: 0; display: block; }</style>
</head>
<body>
<script>
  // Testiapuri: näyttää pelin tarkan kokoisessa kehyksessä (esim. puhelimen näyttö 390×844)
  var p = new URLSearchParams(location.search);
  var f = document.createElement('iframe');
  f.width = p.get('w') || 390;
  f.height = p.get('h') || 844;
  f.src = p.get('src') || '../peli/index.html';
  document.body.appendChild(f);
</script>
</body>
</html>
